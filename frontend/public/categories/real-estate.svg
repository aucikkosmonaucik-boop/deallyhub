<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="dropHouse" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropHouse)">
    <!-- Chimney -->
    <rect x="63" y="24" width="8" height="18" rx="1" fill="#94A3B8"/>
    <rect x="61" y="22" width="12" height="4" rx="1" fill="#64748B"/>
    
    <!-- Main Walls -->
    <rect x="24" y="44" width="52" height="38" rx="2" fill="url(#wallGrad)"/>
    <path d="M24 44 L50 20 L76 44 Z" fill="url(#wallGrad)"/>
    
    <!-- Roof with Overhang -->
    <path d="M19 45 L50 17 L81 45 L75 49 L50 26 L25 49 Z" fill="url(#roofGrad)"/>
    
    <!-- Window with Warm Glow -->
    <rect x="31" y="51" width="14" height="14" rx="2" fill="#FEF08A" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="38" y1="51" x2="38" y2="65" stroke="#CBD5E1" stroke-width="1.2"/>
    <line x1="31" y1="58" x2="45" y2="58" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Front Door -->
    <rect x="54" y="52" width="16" height="30" rx="2" fill="url(#doorGrad)"/>
    <circle cx="58" cy="67" r="1.5" fill="#FACC15"/>
    
    <!-- Welcome Mat -->
    <rect x="52" y="80" width="20" height="3" rx="1" fill="#64748B"/>

    <!-- Floating House Key Badge -->
    <g transform="translate(62, 54)">
      <circle cx="16" cy="16" r="13" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="13" cy="13" r="4" stroke="#78350F" stroke-width="2" fill="none"/>
      <path d="M16 16 L23 23 L22 25 L20 23 L19 24 L17 22" stroke="#78350F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>