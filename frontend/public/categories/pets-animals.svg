<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="corgiFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="80%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="dropPet" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropPet)">
    <!-- Corgi Big Ears -->
    <polygon points="26,14 42,34 20,38" fill="url(#corgiFur)"/>
    <polygon points="26,18 38,33 24,36" fill="#FEE2E2"/>
    
    <polygon points="74,14 80,38 58,34" fill="url(#corgiFur)"/>
    <polygon points="74,18 76,36 62,33" fill="#FEE2E2"/>
    
    <!-- Head Base -->
    <ellipse cx="50" cy="46" rx="24" ry="20" fill="url(#corgiFur)"/>
    
    <!-- White Blaze on Face -->
    <path d="M46 28 C48 36 43 46 36 54 C42 58 58 58 64 54 C57 46 52 36 54 28 Z" fill="#FFFFFF"/>
    
    <!-- Cute Eyes -->
    <ellipse cx="38" cy="42" rx="3.5" ry="4.5" fill="#1E293B"/>
    <circle cx="39" cy="40.5" r="1.2" fill="#FFFFFF"/>
    <ellipse cx="62" cy="42" rx="3.5" ry="4.5" fill="#1E293B"/>
    <circle cx="63" cy="40.5" r="1.2" fill="#FFFFFF"/>
    
    <!-- Nose & Mouth -->
    <ellipse cx="50" cy="50" rx="3.5" ry="2.5" fill="#0F172A"/>
    <path d="M47 52 Q50 56 53 52" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Tongue -->
    <path d="M48 53 C48 58 52 58 52 53 Z" fill="#FB7185"/>

    <!-- Body & Paws -->
    <path d="M32 58 L32 78 C32 80 34 82 37 82 L42 82 C44 82 45 80 45 78 L45 64 L55 64 L55 78 C55 80 56 82 59 82 L64 82 C66 82 68 80 68 78 L68 58 Z" fill="#FFFFFF"/>
    <path d="M26 62 C26 72 28 80 34 82 L34 60 Z" fill="url(#corgiFur)"/>
    <path d="M74 62 C74 72 72 80 66 82 L66 60 Z" fill="url(#corgiFur)"/>

    <!-- Blue Collar & Gold Medal -->
    <rect x="36" y="58" width="28" height="5" rx="2.5" fill="#0284C7"/>
    <circle cx="50" cy="66" r="3.5" fill="#FACC15" stroke="#EAB308" stroke-width="1"/>
  </g>
