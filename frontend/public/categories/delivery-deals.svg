<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardboard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2B180"/>
      <stop offset="100%" stop-color="#BA8048"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="dropDeliv" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropDeliv)">
    <!-- Speed motion lines behind box -->
    <line x1="8" y1="46" x2="22" y2="46" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="56" x2="18" y2="56" stroke="#FB7185" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="10" y1="66" x2="22" y2="66" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>

    <!-- Shipping Box Base -->
    <rect x="24" y="34" width="56" height="48" rx="4" fill="url(#cardboard)"/>
    
    <!-- Top Flaps Seam -->
    <polygon points="24,34 52,44 80,34 52,24" fill="#D4975C"/>
    
    <!-- Sealing Tape -->
    <line x1="52" y1="24" x2="52" y2="82" stroke="url(#tapeGrad)" stroke-width="8"/>
    
    <!-- Shipping Label with Barcode -->
    <rect x="30" y="52" width="18" height="14" rx="1.5" fill="#FFFFFF"/>
    <line x1="33" y1="55" x2="33" y2="63" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="36" y1="55" x2="36" y2="63" stroke="#1E293B" stroke-width="2"/>
    <line x1="40" y1="55" x2="40" y2="63" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="43" y1="55" x2="43" y2="63" stroke="#1E293B" stroke-width="1.8"/>

    <!-- Fragile / Handle With Care Glass Icon -->
    <g transform="translate(60, 52)">
      <path d="M4 2 L12 2 L12 8 C12 11 10 13 8 13 C6 13 4 11 4 8 Z" fill="#92400E" opacity="0.6"/>
      <line x1="8" y1="13" x2="8" y2="18" stroke="#92400E" stroke-width="1.5" opacity="0.6"/>
      <line x1="5" y1="18" x2="11" y2="18" stroke="#92400E" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>
</svg>