<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rimAlloy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="brakeDisc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="dropPart" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropPart)">
    <!-- Ventilated Brake Rotor -->
    <circle cx="50" cy="50" r="34" fill="url(#brakeDisc)"/>
    <circle cx="50" cy="50" r="30" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
    <circle cx="50" cy="50" r="26" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 4" fill="none"/>

    <!-- Red Brembo-style Brake Caliper -->
    <path d="M22 28 C26 22 36 18 46 18 L46 30 C40 30 32 34 28 38 Z" fill="#DC2626"/>
    <circle cx="36" cy="24" r="2" fill="#FFFFFF"/>

    <!-- High-Performance Wheel Rim Outer Barrel -->
    <circle cx="50" cy="50" r="26" stroke="url(#rimAlloy)" stroke-width="4" fill="none"/>
    
    <!-- 5-Spoke Star Rim Pattern -->
    <g transform="translate(50, 50)">
      <circle cx="0" cy="0" r="8" fill="url(#rimAlloy)"/>
      <circle cx="0" cy="0" r="4" fill="#0F172A"/>
      <!-- Spokes -->
      <rect x="-3" y="-24" width="6" height="18" rx="2" fill="url(#rimAlloy)"/>
      <rect x="-3" y="-24" width="6" height="18" rx="2" fill="url(#rimAlloy)" transform="rotate(72)"/>
      <rect x="-3" y="-24" width="6" height="18" rx="2" fill="url(#rimAlloy)" transform="rotate(144)"/>
      <rect x="-3" y="-24" width="6" height="18" rx="2" fill="url(#rimAlloy)" transform="rotate(216)"/>
      <rect x="-3" y="-24" width="6" height="18" rx="2" fill="url(#rimAlloy)" transform="rotate(288)"/>
    </g>
  </g>
</svg>