<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wrenchSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="screwGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dropServ" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropServ)">
    <!-- Screwdriver (Diagonal 1) -->
    <g transform="rotate(45 50 50)">
      <rect x="48" y="16" width="4" height="34" fill="url(#wrenchSteel)"/>
      <polygon points="48,16 52,16 50,11" fill="#475569"/>
      <!-- Handle -->
      <rect x="45" y="50" width="10" height="34" rx="4" fill="url(#screwGrip)"/>
      <line x1="48" y1="56" x2="48" y2="78" stroke="#0F172A" stroke-width="2"/>
      <line x1="52" y1="56" x2="52" y2="78" stroke="#0F172A" stroke-width="2"/>
    </g>

    <!-- Wrench (Diagonal 2) -->
    <g transform="rotate(-45 50 50)">
      <!-- Handle -->
      <rect x="46" y="24" width="8" height="52" rx="3" fill="url(#wrenchSteel)"/>
      <!-- Closed End (bottom) -->
      <circle cx="50" cy="78" r="8" fill="url(#wrenchSteel)"/>
      <circle cx="50" cy="78" r="4.5" fill="#FFFFFF"/>
      <!-- Open End Jaw (top) -->
      <path d="M42 24 C40 16 46 10 50 10 C54 10 60 16 58 24 L52 24 L52 18 L48 18 L48 24 Z" fill="url(#wrenchSteel)"/>
    </g>

    <!-- Green Service Guarantee Badge -->
    <circle cx="50" cy="50" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M45 50 L49 54 L56 46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>