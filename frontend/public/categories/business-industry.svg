<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#E5A823"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="dropInd" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropInd)">
    <!-- Smokestacks -->
    <path d="M28 28 L32 55 L24 55 L26 28 Z" fill="url(#pipeGrad)"/>
    <rect x="25" y="26" width="5" height="3" rx="1" fill="#475569"/>
    <path d="M38 22 L43 55 L35 55 L37 22 Z" fill="url(#pipeGrad)"/>
    <rect x="36" y="20" width="5" height="3" rx="1" fill="#475569"/>
    
    <!-- Clean Energy Clouds / Smoke -->
    <circle cx="28" cy="18" r="4" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="34" cy="13" r="5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="43" cy="12" r="5.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="51" cy="9" r="4" fill="#FFFFFF" opacity="0.6"/>

    <!-- Factory Plant Building -->
    <polygon points="18,52 32,38 32,52 46,38 46,52 74,52 74,84 18,84" fill="url(#plantGrad)"/>
    <rect x="52" y="44" width="22" height="40" fill="#005A54"/>
    
    <!-- Windows -->
    <rect x="56" y="50" width="6" height="7" rx="1" fill="#A7F3D0"/>
    <rect x="65" y="50" width="6" height="7" rx="1" fill="#A7F3D0"/>
    <rect x="56" y="61" width="6" height="7" rx="1" fill="#A7F3D0"/>
    <rect x="65" y="61" width="6" height="7" rx="1" fill="#A7F3D0"/>

    <!-- Industrial Precision Gear in Foreground -->
    <g transform="translate(42, 48)">
      <circle cx="24" cy="24" r="16" fill="url(#gearGrad)"/>
      <rect x="21" y="5" width="6" height="38" rx="2" fill="url(#gearGrad)"/>
      <rect x="5" y="21" width="38" height="6" rx="2" fill="url(#gearGrad)"/>
      <rect x="21" y="5" width="6" height="38" rx="2" fill="url(#gearGrad)" transform="rotate(45 24 24)"/>
      <rect x="5" y="21" width="38" height="6" rx="2" fill="url(#gearGrad)" transform="rotate(45 24 24)"/>
      <circle cx="24" cy="24" r="13" fill="url(#gearGrad)"/>
      <circle cx="24" cy="24" r="7" fill="#004D40"/>
    </g>
  </g>
</svg>