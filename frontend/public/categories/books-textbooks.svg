<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="dropBook" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropBook)">
    <!-- Open Book Pages Left & Right -->
    <path d="M50 36 C42 32 30 32 18 36 L18 72 C30 68 42 68 50 72 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M50 36 C58 32 70 32 82 36 L82 72 C70 68 58 68 50 72 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Spine Center -->
    <path d="M50 36 L50 72" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Text Lines on Pages -->
    <line x1="24" y1="44" x2="42" y2="42" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="52" x2="42" y2="50" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="60" x2="36" y2="58" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    
    <line x1="58" y1="42" x2="76" y2="44" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="50" x2="76" y2="52" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="58" x2="70" y2="60" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Red Bookmark Ribbon -->
    <path d="M50 36 L50 64 L53 60 L56 64 L56 36 Z" fill="#EF4444"/>

    <!-- Desk Reading Lamp with Light Beam -->
    <g transform="translate(62, 14)">
      <path d="M4 18 C8 12 18 12 22 18 Z" fill="#F59E0B"/>
      <path d="M12 12 L12 4 L2 4" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Soft Light Beam -->
      <polygon points="5,18 21,18 30,38 -4,38" fill="#FEF08A" opacity="0.3"/>
    </g>
  </g>
</svg>