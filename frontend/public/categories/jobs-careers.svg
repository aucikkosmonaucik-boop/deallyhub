<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="40%" stop-color="#6F4218"/>
      <stop offset="100%" stop-color="#4E2B08"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#C98B1B"/>
    </linearGradient>
    <filter id="dropBrief" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropBrief)">
    <!-- Handle -->
    <path d="M38 27 C38 20 44 17 50 17 C56 17 62 20 62 27" stroke="url(#leather)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="36" y="25" width="4" height="6" rx="1" fill="url(#goldBrass)"/>
    <rect x="60" y="25" width="4" height="6" rx="1" fill="url(#goldBrass)"/>
    
    <!-- Briefcase Body -->
    <rect x="18" y="29" width="64" height="48" rx="6" fill="url(#leather)"/>
    
    <!-- Flap Overlay -->
    <path d="M18 34 C18 31 21 29 24 29 L76 29 C79 29 82 31 82 34 L82 52 C82 54 79 56 76 56 L58 56 L50 62 L42 56 L24 56 C21 56 18 54 18 52 Z" fill="#7D491C"/>
    <path d="M18 34 C18 31 21 29 24 29 L76 29 C79 29 82 31 82 34 L82 50 C82 52 79 54 76 54 L58 54 L50 60 L42 54 L24 54 C21 54 18 52 18 50 Z" fill="url(#leather)"/>
    
    <!-- Edge Stitching -->
    <path d="M21 32 L79 32" stroke="#D4A373" stroke-width="0.8" stroke-dasharray="1.5 2"/>
    <path d="M21 74 L79 74" stroke="#D4A373" stroke-width="0.8" stroke-dasharray="1.5 2"/>
    
    <!-- Brass Buckles -->
    <rect x="30" y="50" width="8" height="12" rx="2" fill="url(#goldBrass)"/>
    <rect x="32" y="53" width="4" height="6" rx="1" fill="#4E2B08"/>
    
    <rect x="62" y="50" width="8" height="12" rx="2" fill="url(#goldBrass)"/>
    <rect x="64" y="53" width="4" height="6" rx="1" fill="#4E2B08"/>

    <!-- Center Keyhole Clasp -->
    <rect x="47" y="54" width="6" height="8" rx="1.5" fill="url(#goldBrass)"/>
    <circle cx="50" cy="57" r="1" fill="#3E2004"/>
  </g>
</svg>