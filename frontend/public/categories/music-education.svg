<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="dropMusic" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropMusic)">
    <!-- Book Stack: Bottom -->
    <rect x="22" y="68" width="56" height="12" rx="2" fill="url(#book1)"/>
    <rect x="26" y="70" width="50" height="8" rx="1" fill="#F8FAFC"/>
    
    <!-- Book Stack: Middle -->
    <rect x="25" y="54" width="50" height="12" rx="2" fill="url(#book2)"/>
    <rect x="29" y="56" width="44" height="8" rx="1" fill="#F8FAFC"/>
    
    <!-- Book Stack: Top -->
    <rect x="28" y="40" width="44" height="12" rx="2" fill="url(#book3)"/>
    <rect x="32" y="42" width="38" height="8" rx="1" fill="#F8FAFC"/>

    <!-- Graduation Cap on Top -->
    <polygon points="50,18 76,28 50,38 24,28" fill="#0F172A"/>
    <rect x="40" y="32" width="20" height="7" rx="3" fill="#1E293B"/>
    <!-- Tassel -->
    <circle cx="50" cy="28" r="2" fill="#FACC15"/>
    <path d="M50 28 Q64 32 66 42" stroke="#FACC15" stroke-width="2" stroke-linecap="round" fill="none"/>
    <rect x="64" y="42" width="4" height="6" rx="1" fill="#FACC15"/>

    <!-- Floating Musical Note -->
    <g transform="translate(68, 14)">
      <circle cx="6" cy="18" r="3.5" fill="#F59E0B"/>
      <rect x="8" y="6" width="2" height="12" fill="#F59E0B"/>
      <path d="M10 6 C14 6 16 9 17 12" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>