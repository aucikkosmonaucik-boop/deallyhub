<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="dropFree" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropFree)">
    <!-- Gift Box Body -->
    <rect x="24" y="46" width="52" height="38" rx="4" fill="url(#boxGrad)"/>
    <!-- Lid -->
    <rect x="20" y="38" width="60" height="12" rx="3" fill="#2DD4BF"/>
    
    <!-- Vertical Ribbon -->
    <rect x="45" y="38" width="10" height="46" fill="url(#ribbonGrad)"/>
    <!-- Horizontal Ribbon -->
    <rect x="20" y="42" width="60" height="5" fill="url(#ribbonGrad)"/>

    <!-- Ribbon Bow -->
    <path d="M48 38 C40 26 30 28 34 36 C38 42 46 39 48 38 Z" fill="url(#ribbonGrad)"/>
    <path d="M52 38 C60 26 70 28 66 36 C62 42 54 39 52 38 Z" fill="url(#ribbonGrad)"/>
    <circle cx="50" cy="38" r="3.5" fill="#CA8A04"/>

    <!-- Hanging 0 zł Tag Badge -->
    <g transform="translate(56, 50)">
      <circle cx="16" cy="16" r="14" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2"/>
      <text x="16" y="21" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">0.-</text>
    </g>
  </g>
</svg>