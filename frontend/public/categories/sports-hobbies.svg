<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
    <filter id="dropSport" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropSport)">
    <!-- Classic Soccer Ball -->
    <circle cx="46" cy="50" r="28" fill="url(#ballShine)"/>
    
    <!-- Center Pentagon -->
    <polygon points="46,42 54,48 51,57 41,57 38,48" fill="#0F172A"/>
    
    <!-- Connecting Pentagons / Seams -->
    <polygon points="46,42 46,30 36,25 32,34 38,48" stroke="#0F172A" stroke-width="1.8" fill="none"/>
    <polygon points="54,48 65,46 69,36 60,30 46,30" stroke="#0F172A" stroke-width="1.8" fill="none"/>
    <polygon points="51,57 60,65 70,62 72,52 65,46" stroke="#0F172A" stroke-width="1.8" fill="none"/>
    <polygon points="41,57 41,69 49,76 58,73 60,65" stroke="#0F172A" stroke-width="1.8" fill="none"/>
    <polygon points="38,48 27,51 25,62 34,68 41,57" stroke="#0F172A" stroke-width="1.8" fill="none"/>
    
    <!-- Edge Pentagons filled -->
    <polygon points="46,30 42,22 50,22 55,25 46,30" fill="#0F172A"/>
    <polygon points="70,62 74,60 74,66 70,62" fill="#0F172A"/>
    <polygon points="27,51 20,48 20,56 25,62" fill="#0F172A"/>

    <!-- Sports Gold Medal with Ribbon -->
    <g transform="translate(62, 38)">
      <path d="M8 8 L3 24 L13 24 Z" fill="#EF4444"/>
      <path d="M12 8 L7 24 L17 24 Z" fill="#3B82F6"/>
      <circle cx="10" cy="26" r="10" fill="#FACC15" stroke="#B45309" stroke-width="1.5"/>
      <path d="M10 20 L11.5 24 L16 24.5 L12.5 27.5 L13.5 32 L10 29.5 L6.5 32 L7.5 27.5 L4 24.5 L8.5 24 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>