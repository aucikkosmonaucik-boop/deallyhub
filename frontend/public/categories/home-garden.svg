<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="plantLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="dropChair" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropChair)">
    <!-- Chair Legs -->
    <line x1="28" y1="68" x2="22" y2="84" stroke="#854D0E" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="56" y1="68" x2="62" y2="84" stroke="#854D0E" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="36" y1="68" x2="34" y2="82" stroke="#543108" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="48" y1="68" x2="50" y2="82" stroke="#543108" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- Armchair Backrest -->
    <path d="M26 30 C26 24 32 20 42 20 C52 20 58 24 58 30 L58 58 L26 58 Z" fill="url(#chairGrad)"/>
    <!-- Tufting Buttons -->
    <circle cx="36" cy="34" r="1.8" fill="#0C4A6E"/>
    <circle cx="48" cy="34" r="1.8" fill="#0C4A6E"/>
    <circle cx="42" cy="44" r="1.8" fill="#0C4A6E"/>
    
    <!-- Seat Cushion -->
    <rect x="22" y="55" width="40" height="15" rx="6" fill="#38BDF8"/>
    <rect x="23" y="57" width="38" height="12" rx="5" fill="url(#chairGrad)"/>

    <!-- Potted Plant (Garden) -->
    <ellipse cx="76" cy="80" rx="9" ry="4" fill="#64748B" opacity="0.3"/>
    <!-- Pot -->
    <polygon points="71,68 81,68 79,80 73,80" fill="#EA580C"/>
    <rect x="70" y="66" width="12" height="3" rx="1" fill="#C2410C"/>
    <!-- Leaves -->
    <path d="M76 66 C73 58 68 54 62 55 C64 62 70 65 76 66 Z" fill="url(#plantLeaf)"/>
    <path d="M76 66 C78 55 83 48 90 49 C90 58 83 63 76 66 Z" fill="url(#plantLeaf)"/>
    <path d="M76 66 C75 52 79 43 83 41 C84 50 80 60 76 66 Z" fill="#22C55E"/>
  </g>
</svg>