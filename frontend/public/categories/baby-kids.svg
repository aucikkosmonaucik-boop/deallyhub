<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strollerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="dropBaby" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropBaby)">
    <!-- Handle bar -->
    <path d="M18 26 L36 50" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <path d="M16 26 C16 23 20 22 23 25" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Frame Tubes -->
    <line x1="36" y1="50" x2="34" y2="76" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="36" y1="50" x2="66" y2="76" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="34" y1="76" x2="66" y2="76" stroke="#64748B" stroke-width="2.5"/>

    <!-- Bassinet / Canopy -->
    <path d="M32 46 C32 32 44 24 58 24 L60 46 Z" fill="url(#strollerGrad)"/>
    <path d="M30 46 L76 46 C78 46 80 48 78 54 C74 64 62 66 40 66 C32 66 28 58 30 46 Z" fill="url(#strollerGrad)"/>
    
    <!-- Canopy Ribs / Fold Details -->
    <path d="M44 26 L58 46" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Wheels -->
    <circle cx="34" cy="76" r="9" fill="#0F172A"/>
    <circle cx="34" cy="76" r="5" fill="#FFFFFF"/>
    <circle cx="34" cy="76" r="2" fill="#64748B"/>
    
    <circle cx="66" cy="76" r="9" fill="#0F172A"/>
    <circle cx="66" cy="76" r="5" fill="#FFFFFF"/>
    <circle cx="66" cy="76" r="2" fill="#64748B"/>
  </g>
</svg>