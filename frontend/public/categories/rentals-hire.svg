<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="dropRent" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#dropRent)">
    <!-- Calendar Body -->
    <rect x="22" y="24" width="56" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Top Header -->
    <path d="M22 32 C22 27 27 24 32 24 L68 24 C73 24 78 27 78 32 L78 40 L22 40 Z" fill="url(#calHeader)"/>
    
    <!-- Spiral Rings -->
    <rect x="32" y="20" width="4" height="8" rx="2" fill="#0F172A"/>
    <rect x="48" y="20" width="4" height="8" rx="2" fill="#0F172A"/>
    <rect x="64" y="20" width="4" height="8" rx="2" fill="#0F172A"/>
    
    <!-- Calendar Grid Dots / Days -->
    <circle cx="34" cy="50" r="2.5" fill="#94A3B8"/>
    <circle cx="50" cy="50" r="2.5" fill="#94A3B8"/>
    <circle cx="66" cy="50" r="2.5" fill="#94A3B8"/>
    
    <circle cx="34" cy="62" r="2.5" fill="#94A3B8"/>
    <circle cx="50" cy="62" r="2.5" fill="#4F46E5"/>
    <circle cx="66" cy="62" r="2.5" fill="#94A3B8"/>

    <!-- Checkmark Circle on Rented Day -->
    <circle cx="50" cy="62" r="7" fill="#4F46E5" opacity="0.15"/>

    <!-- Key Symbol Overlay -->
    <g transform="translate(52, 48)">
      <circle cx="18" cy="18" r="14" fill="#FACC15" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="14" cy="15" r="4.5" stroke="#78350F" stroke-width="2" fill="none"/>
      <path d="M18 18 L26 26 L24 28 L22 26 L21 27 L19 25" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>